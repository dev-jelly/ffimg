# Gitea pull-mirror CI. Source checks are retained from .github/workflows.
# GitHub Pages publication remains in the GitHub workflow until artifact handoff is configured.
name: Deploy GitHub Pages
'on':
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.23.1
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Test Sites build
      run: npm test
    - name: Test GitHub Pages export
      run: npm run test:pages
    - name: Store verified static site
      uses: actions/upload-artifact@v4
      with:
        name: static-site
        path: out
        include-hidden-files: true
        retention-days: 14
    timeout-minutes: 60
